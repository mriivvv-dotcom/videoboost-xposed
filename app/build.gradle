plugins {
    id 'com.android.application'
}

android {
    namespace 'com.custom.videoboost'
    compileSdk 34

    defaultConfig {
        applicationId "com.custom.videoboost"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
